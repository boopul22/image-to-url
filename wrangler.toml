name = "image-to-url"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat", "nodejs_compat_populate_process_env"]
main = ".open-next/worker.js"

assets = { directory = ".open-next/assets", binding = "ASSETS" }

# Environment variables - set these in Cloudflare Dashboard under Workers & Pages > image-to-url > Settings > Variables
# OR add them here for local development (secrets should use wrangler secret put)
[vars]
R2_BUCKET_NAME = "imgtourl"
# R2_ACCOUNT_ID = ""      # Set in dashboard or via: wrangler secret put R2_ACCOUNT_ID
# R2_ACCESS_KEY_ID = ""   # Set in dashboard or via: wrangler secret put R2_ACCESS_KEY_ID
# R2_SECRET_ACCESS_KEY = "" # Set in dashboard or via: wrangler secret put R2_SECRET_ACCESS_KEY
# R2_PUBLIC_URL = ""      # Set in dashboard or via: wrangler secret put R2_PUBLIC_URL

[[kv_namespaces]]
binding = "NEXT_INC_CACHE_KV"
id = "ae23ff7377d04fc3b60165aa075c1c5d"

[[r2_buckets]]
binding = "R2_BUCKET"
bucket_name = "imgtourl"
